# Remplaçant du cron Discord « ClearOutside Saucats » de neissa.org.
# Démarrage : docker compose up -d     Test immédiat : docker compose exec planificateur sh /app/clearoutside.sh
services:
  gotenberg:
    image: gotenberg/gotenberg:9          # Chromium headless + API de capture d'écran
    restart: unless-stopped

  planificateur:
    image: curlimages/curl:8.23.0         # curl + crond (busybox), rien d'autre
    restart: unless-stopped
    user: root                            # crond doit tourner en root
    depends_on: [gotenberg]
    environment:
      GOTENBERG_URL: http://gotenberg:3000
      TZ: CET-1CEST,M3.5.0,M10.5.0/3      # heure de Paris (format POSIX : l'image n'a pas tzdata)
    volumes:
      - ./clearoutside.sh:/app/clearoutside.sh:ro
      - ./.env:/app/.env:ro               # contient DISCORD_WEBHOOK_URL
    # Vendredi et samedi à 16:00, heure de Paris, comme l'ancien cron
    entrypoint: ["sh", "-c", "echo '0 16 * * 5,6 sh /app/clearoutside.sh' > /etc/crontabs/root && exec crond -f -l 6"]
