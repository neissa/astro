# Remplaçant du cron Discord « ClearOutside Saucats » de neissa.org.
# Démarrage : docker compose up -d     Test immédiat : docker compose exec planificateur python /app/clearoutside.py
services:
  chrome:
    image: chromedp/headless-shell:stable # Chrome headless seul (≈ 540 Mo), piloté par le protocole DevTools sur le port 9222
    container_name: clearoutside-chrome
    restart: "no"                         # arrêté en temps normal : le planificateur le démarre pour chaque capture, puis l'arrête
    init: true                            # transmet le SIGTERM de « docker stop » à Chrome, qui s'arrête alors aussitôt

  planificateur:
    image: python:3.13-alpine             # Python (bibliothèque standard seule) + crond (busybox), ≈ 70 Mo
    restart: unless-stopped
    user: root                            # crond et l'accès au socket Docker demandent root
    depends_on: [chrome]
    environment:
      CHROME_HOST: chrome:9222
      CHROME_CONTAINER: clearoutside-chrome
      TZ: CET-1CEST,M3.5.0,M10.5.0/3      # heure de Paris (format POSIX : l'image n'a pas tzdata)
    volumes:
      - ./clearoutside.py:/app/clearoutside.py:ro
      - ./.env:/app/.env:ro               # contient DISCORD_WEBHOOK_URL
      - /var/run/docker.sock:/var/run/docker.sock   # pour démarrer/arrêter Chrome
    # Au démarrage : arrête Chrome (lancé par « docker compose up »), puis
    # vendredi et samedi à 16:00, heure de Paris, comme l'ancien cron.
    entrypoint:
      - sh
      - -c
      - |
        python /app/clearoutside.py --arreter-chrome
        echo '0 16 * * 5,6 python /app/clearoutside.py' > /etc/crontabs/root
        exec crond -f -l 6
